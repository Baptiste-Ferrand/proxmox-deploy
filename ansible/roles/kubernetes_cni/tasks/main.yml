- name: Install Helm APT prerequisites
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - gpg
      - apt-transport-https
    state: present
  when: not ansible_check_mode

- name: Download Helm APT repository signing key
  ansible.builtin.get_url:
    url: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
    dest: /tmp/helm-apt.gpg
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Read Helm APT signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /tmp/helm-apt.gpg
  changed_when: false
  register: helm_apt_key_information
  when: not ansible_check_mode

- name: Verify Helm APT signing key fingerprint
  ansible.builtin.assert:
    that:
      - >-
        'DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6'
        in helm_apt_key_information.stdout
    fail_msg: >-
      The Helm APT signing key fingerprint does not match the expected
      Buildkite Helm repository key.
  when: not ansible_check_mode

- name: Install Helm APT repository keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /usr/share/keyrings/helm.gpg
      - /tmp/helm-apt.gpg
  changed_when: false
  when: not ansible_check_mode

- name: Configure Helm APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/helm-stable-debian.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main
  when: not ansible_check_mode

- name: Refresh APT cache after adding Helm repository
  ansible.builtin.apt:
    update_cache: true
  when: not ansible_check_mode

- name: Install Helm
  ansible.builtin.apt:
    name: helm
    state: present
  when: not ansible_check_mode

- name: Verify Helm CLI installation
  ansible.builtin.command:
    argv:
      - helm
      - version
      - --short
  changed_when: false
  register: helm_version
  when: not ansible_check_mode

- name: Display installed Helm version
  ansible.builtin.debug:
    msg: "{{ helm_version.stdout }}"
  when: not ansible_check_mode

- name: Check whether kubeadm cluster-info ConfigMap exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - configmap
      - cluster-info
      - -n
      - kube-public
  register: kubeadm_cluster_info
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Restore kubeadm bootstrap token configuration when cluster-info is missing
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - bootstrap-token
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --skip-token-print
  when:
    - not ansible_check_mode
    - kubeadm_cluster_info.rc != 0

- name: Verify kubeadm cluster-info ConfigMap
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - configmap
      - cluster-info
      - -n
      - kube-public
  changed_when: false
  when: not ansible_check_mode

- name: Add Cilium Helm repository
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - cilium
      - "{{ cilium_helm_repository }}"
      - --force-update
  changed_when: false

- name: Update Helm repositories
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - update
  changed_when: false

- name: Install Gateway API standard CRDs
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --server-side
      - -f
      - "{{ item }}"
  loop:
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_gateways.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml"
    - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml"
  register: gateway_api_crds
  changed_when: >-
    'created' in gateway_api_crds.stdout
    or 'configured' in gateway_api_crds.stdout
  when: not ansible_check_mode

- name: Install Cilium with kube-proxy replacement
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cilium
      - cilium/cilium
      - --version
      - "{{ cilium_chart_version }}"
      - --namespace
      - kube-system
      - --set
      - "kubeProxyReplacement={{ cilium_kube_proxy_replacement | lower }}"
      - --set
      - "k8sServiceHost={{ kubernetes_control_plane_vip }}"
      - --set
      - "k8sServicePort=6443"
      - --set
      - "operator.replicas={{ cilium_operator_bootstrap_replicas }}"
      - --set
      - "gatewayAPI.enabled=true"
      - --set
      - "l2announcements.enabled=true"
      - --set
      - "externalIPs.enabled=true"
      - --set
      - "gatewayAPI.gatewayClass.create=auto"
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true
  when: not ansible_check_mode

- name: Restart Cilium DaemonSet after Gateway API activation
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - -n
      - kube-system
      - rollout
      - restart
      - daemonset/cilium
  changed_when: true
  when: not ansible_check_mode

- name: Wait for Cilium DaemonSet rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/cilium
      - --timeout=10m
  changed_when: false
  when: not ansible_check_mode

- name: Wait for Cilium operator rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - -n
      - kube-system
      - rollout
      - status
      - deployment/cilium-operator
      - --timeout=10m
  changed_when: false
  when: not ansible_check_mode

- name: Verify Gateway API CRDs are installed
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - crd
      - "{{ item }}"
  loop:
    - "gatewayclasses.gateway.networking.k8s.io"
    - "gateways.gateway.networking.k8s.io"
    - "httproutes.gateway.networking.k8s.io"
  changed_when: false
  when: not ansible_check_mode

- name: Wait for the Cilium GatewayClass
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - --for=condition=Accepted
      - gatewayclass/cilium
      - --timeout=5m
  changed_when: false
  when: not ansible_check_mode

- name: Display current Kubernetes node state after Cilium installation
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - nodes
      - -o
      - wide
  changed_when: false
  register: cilium_nodes
  when: not ansible_check_mode

- name: Show Kubernetes nodes
  ansible.builtin.debug:
    var: cilium_nodes.stdout_lines
  when: not ansible_check_mode