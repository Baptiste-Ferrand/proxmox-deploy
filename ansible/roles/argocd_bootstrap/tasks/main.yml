- name: Render Argo CD GitOps repository credentials
  ansible.builtin.template:
    src: gitops-repository-secret.yaml.j2
    dest: /etc/kubernetes/argocd-gitops-repository-secret.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

- name: Apply Argo CD GitOps repository credentials
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - -f
      - /etc/kubernetes/argocd-gitops-repository-secret.yaml
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Render Argo CD root application manifest
  ansible.builtin.template:
    src: root-application.yaml.j2
    dest: /etc/kubernetes/root-application.yaml
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

- name: Apply Argo CD root application
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - -f
      - /etc/kubernetes/root-application.yaml
  changed_when: true
  when: not ansible_check_mode