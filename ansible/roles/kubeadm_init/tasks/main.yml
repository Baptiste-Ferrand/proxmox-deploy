- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Create kubeadm configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Run kubeadm preflight checks
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - preflight
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
  changed_when: false
  when:
    - not kubeadm_admin_conf.stat.exists
    - not ansible_check_mode

- name: Initialize the first control plane without kube-proxy
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
      - --upload-certs
      - --skip-phases=addon/kube-proxy
  when:
    - not kubeadm_admin_conf.stat.exists
    - not ansible_check_mode
  no_log: true

- name: Create kubeconfig directory for the administrative user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: not ansible_check_mode

- name: Copy administrator kubeconfig for the administrative user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Ensure kubeadm cluster administrators have the cluster-admin role
  ansible.builtin.template:
    src: kubeadm-cluster-admin-binding.yml.j2
    dest: /etc/kubernetes/kubeadm-cluster-admin-binding.yml
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

- name: Apply kubeadm cluster administrator RBAC binding with super-admin access
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/super-admin.conf
      - apply
      - -f
      - /etc/kubernetes/kubeadm-cluster-admin-binding.yml
  changed_when: >-
    'created' in kubeadm_cluster_admin_binding.stdout
    or 'configured' in kubeadm_cluster_admin_binding.stdout
  register: kubeadm_cluster_admin_binding
  when: not ansible_check_mode

- name: Wait until admin.conf can list Kubernetes nodes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - nodes
  changed_when: false
  register: kubernetes_nodes
  retries: 12
  delay: 5
  until: kubernetes_nodes.rc == 0
  when: not ansible_check_mode

- name: Show Kubernetes nodes after control-plane bootstrap
  ansible.builtin.debug:
    var: kubernetes_nodes.stdout_lines
  when: not ansible_check_mode